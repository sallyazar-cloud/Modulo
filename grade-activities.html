<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ff">
  <title>Grade Activities | Modulo</title>
  <link rel="stylesheet" href="assets/andika.css">
  <link rel="stylesheet" href="assets/learning-menu.css">
  <link rel="stylesheet" href="assets/grade-activities.css">
  <link rel="stylesheet" href="assets/halloween-theme.css">
</head>
<body>
  <a class="seasonal-banner" href="index.html" aria-label="Modulo home">
    <img src="assets/halloween-season.jfif" alt="Halloween-themed Modulo logo with a smiling pumpkin">
  </a>
  <header class="topbar shell">
    <details class="learning-menu" data-learning-menu aria-label="Choose a class or subject"></details>
    <a class="brand" href="index.html" aria-label="Modulo home">
      <img class="brand-photo" src="assets/miss-salma-photo.jfif" alt="">
      <span>Modulo</span>
    </a>
  </header>

  <main class="shell">
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Vocabulary · Reading · Grammar · Writing</p>
      <h1 id="page-title">English practice for <span id="grade-title">your grade</span></h1>
      <p>Choose a subject from the top-left menu, then pick a challenge level.</p>
    </section>

    <div class="toolbar">
      <div class="level-picker" role="group" aria-label="Challenge level">
        <button class="level-button" type="button" data-level="easy" aria-pressed="true">Easy: The Curious Researcher</button>
        <button class="level-button" type="button" data-level="medium" aria-pressed="false">Medium: The Keen Observer</button>
        <button class="level-button" type="button" data-level="hard" aria-pressed="false">Hard: The Language Guru</button>
      </div>
      <p class="timer-label" id="timer" aria-live="off">Time: 60 seconds</p>
    </div>

    <section class="activity" aria-labelledby="activity-title">
      <div class="activity-head">
        <p class="eyebrow" id="activity-level"></p>
        <h2 id="activity-title"></h2>
        <p id="activity-instructions"></p>
      </div>
      <div class="activity-content" id="activity-content"></div>
      <div class="action-row">
        <button class="primary-button" id="check-answer" type="button">Check answer</button>
        <button class="secondary-button" id="retry-activity" type="button" hidden>Try again</button>
        <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <footer class="shell">Short steps, kind practice, and learning at your own pace.</footer>
  <script src="assets/activity-timer.js"></script>
  <script src="assets/learning-menu.js"></script>
  <script src="assets/grade-activities.js"></script>
</body>
</html>
